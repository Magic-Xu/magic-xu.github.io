name: Website regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test -- --fully-parallel --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
